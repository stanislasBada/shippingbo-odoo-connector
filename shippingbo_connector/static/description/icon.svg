<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sync arrows -->
  <g fill="none" stroke="#3B97E3" stroke-width="26" stroke-linecap="round">
    <path d="M 108 214 A 156 156 0 0 1 368 146"/>
    <path d="M 404 298 A 156 156 0 0 1 144 366"/>
  </g>
  <polygon points="392,108 398,190 322,168" fill="#3B97E3"/>
  <polygon points="120,404 114,322 190,344" fill="#3B97E3"/>

  <!-- parcel (isometric) -->
  <g stroke="#0E1420" stroke-width="6" stroke-linejoin="round">
    <polygon points="256,170 342,212 256,254 170,212" fill="url(#top)"/>
    <polygon points="170,212 256,254 256,346 170,304" fill="#FFFFFF"/>
    <polygon points="342,212 256,254 256,346 342,304" fill="#C9D5E6"/>
  </g>
  <!-- tape -->
  <polygon points="213,191 299,233 299,251 285,244 285,240 213,205" fill="#3B97E3" opacity="0.9"/>
  <polygon points="285,240 299,233 299,268 285,275" fill="#2C7CC1"/>

  <!-- Catalyt signature dot -->
  <circle cx="440" cy="440" r="26" fill="#3B97E3"/>
</svg>
